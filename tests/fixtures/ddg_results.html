<!-- Small synthetic DuckDuckGo HTML result page (no personal data) used to test the
     first-result parser. Markup mirrors the real html.duckduckgo.com page: each result is
     an <a class="result__a" href="//duckduckgo.com/l/?uddg=...">. -->
<html>
<body>
<div class="results">
  <div class="result results_links">
    <a rel="nofollow" class="result__a"
       href="//duckduckgo.com/l/?uddg=https%3A%2F%2Fgithub.com%2F&amp;rut=abc">GitHub: Let's build from here</a>
    <a class="result__snippet" href="//duckduckgo.com/l/?uddg=https%3A%2F%2Fgithub.com%2F">Code hosting</a>
  </div>
  <div class="result results_links">
    <a rel="nofollow" class="result__a"
       href="https://example.org/docs">Example documentation</a>
  </div>
</div>
</body>
</html>
